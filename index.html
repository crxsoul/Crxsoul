<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe4ec 0%, #fdf2f8 35%, #fff7d6 100%);
            overflow: hidden;
            position: relative;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(6px);
            border: 2px solid rgba(255, 122, 162, 0.35);
            border-radius: 28px;
            box-shadow: 0 18px 40px rgba(221, 83, 129, 0.22);
            padding: 40px 30px 30px;
            width: min(90vw, 540px);
        }

        h1 {
            margin: 0 0 24px;
            font-size: clamp(2rem, 4vw, 3rem);
            color: #c94d7b;
            letter-spacing: 1px;
            text-shadow: 2px 2px 6px rgba(201, 77, 123, 0.15);
        }

        .photo-frame {
            position: relative;
            display: inline-block;
            padding: 12px;
            border-radius: 30px;
            background: linear-gradient(135deg, #ffd4e6, #fff8fb, #f9d9ff);
            box-shadow: 0 8px 24px rgba(201, 77, 123, 0.22);
        }

        .photo-frame::before,
        .photo-frame::after {
            content: "❤";
            position: absolute;
            font-size: 32px;
            color: rgba(31, 167, 172, 0.8);
            animation: floatHeart 2.8s ease-in-out infinite;
        }

        .photo-frame::before {
            top: -20px;
            left: 18px;
        }

        .photo-frame::after {
            right: 18px;
            bottom: -16px;
            animation-delay: 1.2s;
        }

        img {
            width: min(78vw, 280px);
            height: auto;
            display: block;
            object-fit: cover;
            border-radius: 22px;
            border: 5px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 14px 30px rgba(116, 60, 91, 0.22);
        }

        .heart {
            position: absolute;
            width: 18px;
            height: 18px;
            background: #ff5c8a;
            transform: rotate(-45deg);
            border-radius: 4px;
            opacity: 0.8;
            animation: float 5s ease-in-out infinite;
            z-index: 1;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 18px;
            height: 18px;
            background: #ff5c8a;
            border-radius: 50%;
        }

        .heart::before {
            top: -9px;
            left: 0;
        }

        .heart::after {
            left: 9px;
            top: 0;
        }

        .heart.one { top: 8%; left: 12%; animation-delay: 0.5s; }
        .heart.two { top: 18%; right: 16%; animation-delay: 1.2s; }
        .heart.three { bottom: 18%; left: 18%; animation-delay: 2s; }
        .heart.four { bottom: 12%; right: 13%; animation-delay: 0.8s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-45deg); }
            50% { transform: translateY(-12px) rotate(-45deg); }
        }

        @keyframes floatHeart {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.08); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 28px 18px 22px;
            }
        }
    </style>
</head>
<body>
    <span class="heart one"></span>
    <span class="heart two"></span>
    <span class="heart three"></span>
    <span class="heart four"></span>

    <div class="container">
        <h1>Mi amor ❤️</h1>
        <div class="photo-frame">
            <img src="img/mirador.jpeg" alt="Mirador romántico">
        </div>
    </div>
</body>
</html>
